name: CI/CD Projet Robi

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch: # Permet de lancer manuellement le pipeline

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
  COVERAGE_THRESHOLD: 70

jobs:
  # ÉTAPE 1 & 2 : Build et Tests (Sur GitHub, on combine souvent pour profiter du cache)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # Gère automatiquement le cache des dépendances

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava compileTestJava --stacktrace

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: build/test-results/test/
          retention-days: 7

  # ÉTAPE 3 : Couverture JaCoCo
  coverage:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: JaCoCo Coverage & Verification
        run: |
          chmod +x gradlew
          ./gradlew jacocoTestReport jacocoTestCoverageVerification --stacktrace
          
      - name: Check Coverage Threshold
        run: |
          # Extraction simple du pourcentage (adapte le chemin si nécessaire)
          COVERAGE=$(grep -oP 'Total.*?(\d+)%' build/reports/jacoco/test/html/index.html | tail -1 | grep -oP '\d+' | tail -1 || echo "0")
          echo "Couverture : ${COVERAGE}%"
          if [ "$COVERAGE" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "ERREUR : couverture ${COVERAGE}% < seuil ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/
          retention-days: 7

  # ÉTAPE 4 : Analyses Statiques
  static-analysis:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Checkstyle & SpotBugs
        run: |
          chmod +x gradlew
          ./gradlew checkstyleMain checkstyleTest spotbugsMain spotbugsTest --stacktrace

      - name: Upload Analysis Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            build/reports/checkstyle/
            build/reports/spotbugs/
          retention-days: 7

  # ÉTAPE 5 : Rapport Final
  quality-report:
    needs: [coverage, static-analysis]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Generate Dashboard
        run: |
          chmod +x gradlew
          ./gradlew buildDashboard --stacktrace || true
          echo "=== Rapport Qualité Généré ==="

      - name: Upload Final Reports
        uses: actions/upload-artifact@v4
        with:
          name: final-quality-report
          path: build/reports/
          retention-days: 28
